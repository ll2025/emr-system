<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Optometry EHR - Home</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #f7f9fa;
        color: #2f3e46;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      .top-bar {
        height: 50px;
        background-color: #ffffff;
        border-bottom: 1px solid #d0d7de;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px;
        font-weight: bold;
        color: #3b5998;
        flex-shrink: 0;
      }

      .layout-container {
        display: flex;
        flex-grow: 1;
        overflow: hidden;
      }

      .sidebar {
        width: 220px;
        background-color: #34495e;
        color: white;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }

      .sidebar h2 {
        font-size: 1.1rem;
        padding: 20px;
        margin: 0;
        border-bottom: 2px solid #2c3e50;
        color: #ecf0f1;
        text-align: center;
      }

      .sidebar a {
        padding: 15px 20px;
        color: #b0c4de;
        display: block;
        text-decoration: none;
        border-bottom: 1px solid #2c3e50;
        transition:
          background 0.2s,
          color 0.2s;
      }

      .sidebar a:hover,
      .sidebar a.active-link {
        background-color: #4a6fa5;
        color: white;
      }

      .main-content {
        flex-grow: 1;
        overflow-y: auto;
        padding: 30px;
        display: flex;
        justify-content: center;
      }

      .page {
        max-width: 950px;
        width: 100%;
        background: #fff;
        padding: 40px;
        border: 1px solid #d0d7de;
        height: fit-content;
        margin-bottom: 40px;
      }

      h1 {
        margin-top: 0;
        color: #3b5998;
        border-bottom: 2px solid #e1e8ed;
        padding-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="top-bar">
      <span>Optometry Practice Dashboard</span>
      <span>October 30, 2026</span>
    </div>
    <div class="layout-container">
      <div class="sidebar">
        <h2>Optometry EHR</h2>
        <nav>
          <a href="index.html" class="active-link">Home</a>
          <a href="scheduler.html">Scheduler</a>
          <a href="checkin.html">Check-In</a>
          <a href="examination.html">Examination</a>
        </nav>
      </div>
      <div class="main-content">
        <div class="page">
          <h1>Welcome to Clinical EHR</h1>
          <p>
            Select a module from the sidebar or below to begin managing patient
            schedules, check-ins, or examinations.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
